[project]
name = "sontrama"
version = "0.1.0"
description = "Live MIDI studio with replaceable instruments, effect chains and browser audition"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pyfluidsynth>=1.3,<2",
  "mido>=1.3,<2",
  "python-rtmidi>=1.5,<2",
  "sounddevice>=0.5,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
sontrama = "sontrama.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/web",
  "/scripts",
  "/deploy/*.example",
  "/deploy/*.service",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
  "/package.json",
  "/package-lock.json",
  "/.python-version",
  "/tsconfig.json",
  "/vite.config.ts",
  "/playwright.config.ts",
  "/eslint.config.mjs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sontrama"]
